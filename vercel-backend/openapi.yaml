openapi: 3.1.0
info:
  title: HOBEE Commerce API
  version: 0.1.0
  description: Server-only API for authenticated order creation and payment orchestration.
servers:
  - url: https://{deployment-host}
    variables:
      deployment-host:
        default: hobee-backend.vercel.app
paths:
  /api/orders:
    post:
      summary: Create a pending order from current server-side product prices and stock.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Pending order created.
        '400':
          description: Invalid item, quantity, delivery address, or stock state.
        '401':
          description: Missing or invalid Supabase bearer token.
  /api/payments/intent:
    post:
      summary: Create a pending payment record for an owned pending order.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentIntentRequest'
      responses:
        '201':
          description: Payment intent record created. A provider integration can add redirect or client-secret details later.
        '401':
          description: Missing or invalid Supabase bearer token.
        '404':
          description: Owned pending order not found.
  /api/payments/opn-webhook:
    post:
      summary: Verify an Opn charge event against the provider API and transition payment/order state idempotently.
      responses:
        '200':
          description: Event processed, ignored, or previously processed.
        '404':
          description: Payment provider reference not found.
  /api/payments/refunds/process:
    post:
      summary: Process an already-approved after-sales refund through the payment provider. This endpoint is admin-only and never accepts a client-defined amount.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refundId]
              properties:
                refundId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Refund processed or a duplicate request returned safely.
        '403':
          description: Admin role required.
        '409':
          description: Refund is not approved or no supported paid provider payment exists.
  /api/workers/push-outbox:
    post:
      summary: Deliver queued push notifications. Intended for Vercel Cron only.
      security:
        - cronBearer: []
      responses:
        '200':
          description: Queued notifications were processed with sent, suppressed, and failed counts.
  /api/payments/webhook:
    post:
      summary: Receive a signed payment provider event and transition payment/order states idempotently.
      security:
        - webhookSignature: []
      responses:
        '200':
          description: Event processed or previously processed.
        '400':
          description: Unsupported event payload.
        '401':
          description: Invalid webhook signature.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Supabase JWT
    webhookSignature:
      type: apiKey
      in: header
      name: x-hobee-webhook-signature
    cronBearer:
      type: http
      scheme: bearer
  schemas:
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [addressId, items]
      properties:
        addressId:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [productId, quantity]
            properties:
              productId:
                type: string
                format: uuid
              variantId:
                type: string
                format: uuid
              quantity:
                type: integer
                minimum: 1
                maximum: 99
    CreatePaymentIntentRequest:
      type: object
      additionalProperties: false
      required: [orderId, method]
      properties:
        orderId:
          type: string
          format: uuid
        method:
          type: string
          enum: [mock_promptpay, mock_card, opn_promptpay, opn_card]
        cardToken:
          type: string
          description: One-time token from the provider client SDK. Raw card data is never accepted.
